<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090014"/>
      <stop offset="58%" stop-color="#16002b"/>
      <stop offset="100%" stop-color="#050008"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff27a"/>
      <stop offset="35%" stop-color="#ff9d00"/>
      <stop offset="68%" stop-color="#ff00d9"/>
      <stop offset="100%" stop-color="#7a00ff"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff00d9"/>
      <stop offset="100%" stop-color="#00ffe7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunClip">
      <circle cx="600" cy="190" r="118"/>
    </clipPath>
  </defs>

  <rect width="1200" height="440" fill="url(#sky)"/>

  <!-- stars/noise -->
  <g fill="#fff8e7" opacity=".55">
    <circle cx="90" cy="58" r="1"/><circle cx="160" cy="110" r="1.2"/>
    <circle cx="270" cy="48" r="1"/><circle cx="930" cy="72" r="1.2"/>
    <circle cx="1030" cy="120" r="1"/><circle cx="1110" cy="54" r="1"/>
    <circle cx="820" cy="45" r="1"/><circle cx="390" cy="82" r="1"/>
  </g>

  <!-- synthwave sun -->
  <circle cx="600" cy="190" r="118" fill="url(#sun)" filter="url(#glow)"/>
  <g clip-path="url(#sunClip)" stroke="#090014" stroke-width="10">
    <line x1="470" y1="135" x2="730" y2="135"/>
    <line x1="470" y1="158" x2="730" y2="158"/>
    <line x1="470" y1="181" x2="730" y2="181"/>
    <line x1="470" y1="204" x2="730" y2="204"/>
    <line x1="470" y1="227" x2="730" y2="227"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 285 L160 238 L235 270 L345 205 L455 276 L555 222 L625 260 L735 210 L845 272 L960 230 L1080 270 L1200 220 L1200 330 L0 330 Z"
        fill="#07000f" opacity=".98"/>

  <!-- perspective horizon -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#ff00d9" stroke-width="2" opacity=".9"/>

  <!-- perspective grid -->
  <g stroke="url(#grid)" stroke-width="1.2" opacity=".72">
    <line x1="600" y1="315" x2="0" y2="440"/>
    <line x1="600" y1="315" x2="100" y2="440"/>
    <line x1="600" y1="315" x2="200" y2="440"/>
    <line x1="600" y1="315" x2="300" y2="440"/>
    <line x1="600" y1="315" x2="400" y2="440"/>
    <line x1="600" y1="315" x2="500" y2="440"/>
    <line x1="600" y1="315" x2="700" y2="440"/>
    <line x1="600" y1="315" x2="800" y2="440"/>
    <line x1="600" y1="315" x2="900" y2="440"/>
    <line x1="600" y1="315" x2="1000" y2="440"/>
    <line x1="600" y1="315" x2="1100" y2="440"/>
    <line x1="600" y1="315" x2="1200" y2="440"/>
    <path d="M0 332 Q600 324 1200 332"/>
    <path d="M0 350 Q600 337 1200 350"/>
    <path d="M0 372 Q600 352 1200 372"/>
    <path d="M0 398 Q600 371 1200 398"/>
    <path d="M0 428 Q600 394 1200 428"/>
  </g>

  <!-- scanline -->
  <line x1="0" x2="1200" y1="-10" y2="-10" stroke="#00ffe7" stroke-width="1" opacity=".7">
    <animate attributeName="y1" from="-10" to="450" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="y2" from="-10" to="450" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- top chrome -->
  <g font-family="monospace" font-size="15" letter-spacing="2">
    <text x="38" y="34" fill="#00ffe7">PUNE.SECTOR_01 · 2026</text>
    <text x="1162" y="34" text-anchor="end" fill="#ff00d9">SIGNAL.STRENGTH 98%</text>
  </g>

  <!-- chromatic title -->
  <g font-family="monospace" font-weight="700" font-size="66" text-anchor="middle" letter-spacing="3">
    <text x="600" y="148" fill="#ff00d9" opacity=".82">
      <animateTransform attributeName="transform" type="translate"
                        values="-3 1;-2 -1;-3 1" dur="0.18s" repeatCount="indefinite"/>
      SIDDHARTH_SINGH
    </text>
    <text x="600" y="148" fill="#00ffe7" opacity=".82">
      <animateTransform attributeName="transform" type="translate"
                        values="3 -1;2 1;3 -1" dur="0.18s" repeatCount="indefinite"/>
      SIDDHARTH_SINGH
    </text>
    <text x="600" y="148" fill="#fff8e7">SIDDHARTH_SINGH</text>
  </g>

  <!-- role -->
  <text x="600" y="178" text-anchor="middle" font-family="monospace" font-size="21"
        letter-spacing="4" fill="#00ffe7">// CYBERSECURITY.AI.exe</text>

  <!-- status pill -->
  <rect x="38" y="366" width="430" height="38" rx="19" fill="#090014"
        stroke="#ff00d9" stroke-width="1.5"/>
  <circle cx="59" cy="385" r="5" fill="#00ffe7" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="75" y="391" font-family="monospace" font-size="14" letter-spacing="1.4"
        fill="#fff8e7">JACKED IN · NEURAL UPLINK STABLE</text>

  <!-- tags -->
  <g font-family="monospace" font-size="14" letter-spacing="1.2" fill="#fff8e7">
    <text x="1162" y="380" text-anchor="end">[ cybersecurity ] [ ai ]</text>
    <text x="1162" y="402" text-anchor="end">[ python ] [ react ]</text>
  </g>

  <text x="600" y="425" text-anchor="middle" font-family="monospace"
        font-size="11" letter-spacing="2" fill="#ff00d9" opacity=".75">
    SYSTEM.LOG // BUILD · SECURE · LEARN · DEPLOY
  </text>
</svg>
